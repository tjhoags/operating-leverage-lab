# Publishes the static build to GitHub Pages at
# https://<owner>.github.io/operating-leverage-lab/ once Pages is enabled for
# this repository with "GitHub Actions" as the source. Enabling Pages is a
# manual repository setting; this workflow does not change repository settings
# and uses only the free GitHub Pages service.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser checks before publication
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Scan release files
        run: node scripts/scan-private.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
